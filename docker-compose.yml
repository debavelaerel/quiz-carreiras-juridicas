# Ambiente LOCAL de desenvolvimento — NÃO é configuração de produção (mesmo
# modelo do quiz OAB). Sobe MinIO (S3 local) + criação do bucket e o serviço
# Python que gera os PDFs. O Supabase sobe à parte (`npx supabase start`, portas
# 655xx) e o Next roda no host (`npm run dev`).
#
#   docker compose -p quiz-cj --env-file .env.local up -d --build
#
# Credenciais abaixo (minioadmin, segredo-local) são SÓ de desenvolvimento.
name: quiz-cj

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin # só local
      MINIO_ROOT_PASSWORD: minioadmin # só local
    ports:
      - "${MINIO_PORT:-9100}:9000" # API S3 (o navegador baixa o PDF daqui)
      - "${MINIO_CONSOLE_PORT:-9101}:9001" # console web
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/diagnosticos-cj
    restart: "no"

  diagnostico-pdf:
    build: ./services/diagnostico-pdf
    ports:
      - "${DIAGNOSTICO_PDF_PORT:-8100}:8000"
    environment:
      DIAGNOSTICO_SERVICE_SECRET: ${DIAGNOSTICO_SERVICE_SECRET:-segredo-local}
      BUCKET_NAME: ${BUCKET_NAME:-diagnosticos-cj}
      REGION: ${REGION:-sa-east-1}
      S3_ENDPOINT: ${S3_PDF_ENDPOINT-http://minio:9000} # MinIO na rede interna; vazio = AWS
      ACCESS_KEY: ${ACCESS_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-minioadmin}
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
